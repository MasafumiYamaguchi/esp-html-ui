[platformio]
src_dir = firmware
libdeps_dir = ../../examples/counter/.pio/libdeps

[env:t-display-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.4.0
    bodmer/TFT_eSPI@2.5.43
extra_scripts = pre:build.py
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D USER_SETUP_LOADED
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
lib_ldf_mode = chain+
