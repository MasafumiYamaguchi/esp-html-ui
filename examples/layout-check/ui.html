<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Layout check</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <header class="row heading">
      <span>LAYOUT CHECK</span>
      <span class="badge">320 x 170</span>
    </header>
    <section class="row reading">
      <output id="value">0</output>
      <p id="description">A longer caption wraps inside this fixed width.</p>
    </section>
    <nav class="row actions">
      <button id="increment" type="button">Count +1</button>
      <button id="reset" type="button">Reset</button>
    </nav>
    <footer class="row colors">
      <span id="red" class="red">RED</span>
      <span id="green" class="green">GREEN</span>
      <span id="blue" class="blue">BLUE</span>
      <span class="muted">NEXT / OK</span>
    </footer>
  </body>
</html>
