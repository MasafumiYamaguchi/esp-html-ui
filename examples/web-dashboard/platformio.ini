[platformio]
default_envs = t-display-s3

[env:t-display-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 115200
; Use the ROM loader: the temporary upload stub disconnects on this USB setup.
upload_flags = --no-stub
lib_deps =
    lvgl/lvgl@9.4.0
    bodmer/TFT_eSPI@2.5.43
extra_scripts = pre:../../scripts/platformio_codegen.py
custom_ui_name = dashboard
custom_ui_width = 320
custom_ui_height = 170
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D USER_SETUP_LOADED
    -include config/tft_setup.h
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=0
lib_ldf_mode = chain+
