<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>SSD1306 counter</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <p>HTML + CSS OLED</p>
    <section class="reading">
      <span>Count:</span>
      <span id="value">0</span>
    </section>
    <nav class="actions">
      <button id="increment" type="button">+1</button>
      <button id="reset" type="button">Reset</button>
    </nav>
  </body>
</html>
