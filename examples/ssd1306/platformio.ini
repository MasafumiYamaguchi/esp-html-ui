[platformio]
default_envs = esp32-ssd1306

[env:esp32-ssd1306]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    lvgl/lvgl@9.4.0
    adafruit/Adafruit SSD1306@2.5.15
    adafruit/Adafruit GFX Library@1.12.1
    adafruit/Adafruit BusIO@1.17.2
extra_scripts = pre:../../scripts/platformio_codegen.py
custom_ui_name = oled
custom_ui_width = 128
custom_ui_height = 64
build_flags =
    -D LV_CONF_INCLUDE_SIMPLE
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D OLED_ADDRESS=0x3C
    -D OLED_RESET=-1
lib_ldf_mode = chain+
