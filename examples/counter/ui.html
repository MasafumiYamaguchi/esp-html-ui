<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>ESP HTML UI counter</title>
    <link rel="stylesheet" href="ui.css">
  </head>
  <body>
    <header class="row heading">
      <span>ESP HTML UI</span>
      <span class="badge">COUNTER</span>
    </header>
    <section class="row reading">
      <span id="value">0</span>
      <span class="muted">compiled HTML + CSS</span>
    </section>
    <nav class="row actions">
      <button id="increment" type="button">Count +1</button>
      <button id="reset" type="button">Reset</button>
    </nav>
    <p class="muted help">GPIO 0: next / GPIO 14: OK</p>
  </body>
</html>
